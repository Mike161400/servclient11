# ????????? UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson (JSON) ?????????
spring.jackson.encoding.charset=UTF-8
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Moscow

# Database ?????????
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Spring Boot Configuration
spring.application.name=RentalService

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/autoservice_db
spring.datasource.username=autoservice
spring.datasource.password=autoservice123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.rentalservice=DEBUG