spring.application.name=RentalService

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/autoservice_db
spring.datasource.username=autoservice
spring.datasource.password=autoservice123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.rentalservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE