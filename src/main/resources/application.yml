server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

spring:
  application:
    name: antivirus-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoservice_db}
    username: ${SPRING_DATASOURCE_USERNAME:autoservice}
    password: ${SPRING_DATASOURCE_PASSWORD:autoservice123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  security:
    jwt:
      access-secret: ${APP_SECURITY_JWT_ACCESS_SECRET:change-me-access-secret-change-me-access-secret}
      refresh-secret: ${APP_SECURITY_JWT_REFRESH_SECRET:change-me-refresh-secret-change-me-refresh-secret}
      access-expiration: ${APP_SECURITY_JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${APP_SECURITY_JWT_REFRESH_EXPIRATION:30d}
      issuer: ${APP_SECURITY_JWT_ISSUER:antivirus-server}
  eds:
    key-store-path: ${APP_EDS_KEY_STORE_PATH:}
    key-store-type: ${APP_EDS_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${APP_EDS_KEY_STORE_PASSWORD:}
    key-alias: ${APP_EDS_KEY_ALIAS:}
    key-password: ${APP_EDS_KEY_PASSWORD:}
    algorithm: ${APP_EDS_ALGORITHM:SHA256withRSA}
