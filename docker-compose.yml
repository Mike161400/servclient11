services:  # ← ОБЯЗАТЕЛЬНО должен быть ключ services!
  postgres:
    image: postgres:15-alpine
    container_name: autoservice-postgres
    environment:
      POSTGRES_DB: autoservice_db
      POSTGRES_USER: autoservice
      POSTGRES_PASSWORD: autoservice123
      LANG: ru_RU.UTF-8
      LC_ALL: ru_RU.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoservice"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autoservice-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autoservice.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: